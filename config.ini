; config.ini — non-secret defaults for proposal-service.
;
; Values here can be overridden by environment variables.
; See .env.example for the full list of env var names.
;
; Sections are informational only — option names must match the
; pydantic Settings field names exactly (uppercased at load time).
;
; Never put secrets (passwords, client secrets, tokens) in this file.

[api]
; Default company acronym used when /proposal endpoints are called
; without a `company` form field.
company = INTRA
api_prefix = /api/v1

; Default proposal start date (ISO YYYY-MM-DD). Used as a fallback
; when the `start_date` form field is not provided.
proposal_start_date = 2025-01-01

[logging]
; Log level. One of: DEBUG, INFO, WARNING, ERROR, CRITICAL.

[ollama]
; URL of the Ollama HTTP API. Override with the OLLAMA_URL env var when
; running inside docker-compose (use the container name).
ollama_url = http://localhost:11434

; Model name. Must already be pulled on the Ollama server.
ollama_model = qwen2.5:3b
ollama_num_ctx = 8192
ollama_max_workers = 3

[keycloak]
; Internal Keycloak URL (as reachable from the API container).
keycloak_url = http://keycloak:8080

; Realm name. Matches the realm imported from keycloak/import/proposal-realm.json.
keycloak_realm = proposal

; Client ID this API authenticates as.
keycloak_client_id = proposal-api
