events {}

http {
    upstream proposal_api {
        #   api container is running on port 8000
        server api:8000;
    }

    server {
        listen 80;

        client_max_body_size 100M;


        #   Static UI lives here (mount ./web -> /usr/share/nginx/html in compose)
        root /usr/share/nginx/html;
        index index.html;

        
        #   For every request (/, /proposal, /health, etc.))
        location @api {

            #   Forward the request to the proposal_api upstream defined above
            proxy_pass http://proposal_api;
            proxy_set_header Host $host;
            #   Forward the Authorization header to the API container for authentication
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 7200s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 7200s;
        }


        #   Async extraction API: buffering OFF so SSE progress streams live.
        #   This is the most specific prefix, so it wins for /api/v1/extractions/*
        #   over the location / block below.
        location /api/v1/extractions/ {
            proxy_pass http://proposal_api;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            #   Forward the bearer token for verify_token
            proxy_set_header Authorization $http_authorization;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }


        #   Serve a static file if one exists on disk (index.html, future assets),
        #   otherwise fall through to the API. So "/" -> index.html, while
        #   "/proposal", "/health", "/docs", "/api/..." -> @api.
        location / {
            try_files $uri $uri/ @api;
        }

    }
}

