[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "proposal-service"
version = "1.0.0"
description = "Extract structured work-package data from Horizon Europe proposals."
authors = [{ name = "Proposal Service Team" }]
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-multipart>=0.0.20,<0.0.21",
    "python-jose[cryptography]>=3.3,<4.0",
    "requests>=2.32,<3.0",
    "python-dateutil>=2.9,<3.0",
    "pdfplumber>=0.11,<0.12",
    "docling>=2.0,<3.0",
    "gunicorn>=23.0,<24.0",
    "redis>=5.0,<6.0",
    "arq>=0.26,<0.27",
]

[tool.poetry]
# Poetry-specific config that has no PEP 621 equivalent.
packages = [{ include = "proposal_service", from = "src" }]

[tool.poetry.group.dev.dependencies]
black = "^24.0"
isort = "^5.13"
ruff = "^0.6"
mypy = "^1.10"
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
httpx = "^0.27"
pre-commit = "^3.7"
types-requests = "*"
types-python-dateutil = "*"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^8.0"
furo = "^2024.8"
autodoc-pydantic = "^2.2"
sphinxcontrib-applehelp = "*"

# ── Tool config (unchanged) ───────────────────────────────────────────

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["proposal_service"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "SIM", "UP", "I"]
ignore = [
    "E501", # handled by black
    "B008", # FastAPI relies on Depends/Form/File in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src/proposal_service"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:pdfminer.*"]
markers = [
    "integration: requires external services (Ollama, Keycloak, etc.)",
]

[tool.coverage.run]
source = ["src/proposal_service"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]